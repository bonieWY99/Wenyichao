<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腎臟系統分級練習</title><style>
:root{--ink:#17364d;--blue:#176e9e;--pale:#eef7fb;--line:#c9dce7;--easy:#397a4a;--mid:#a66a18;--hard:#a33f38}*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}.wrap{max-width:920px;margin:auto;padding:28px 18px 88px}header{border-left:6px solid var(--blue);padding-left:16px;margin-bottom:24px}h1{font-size:1.7rem;margin:0 0 6px}h2{font-size:1.2rem;margin:28px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 2px 9px #113a5011}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-weight:700}input{width:100%;padding:10px;border:1px solid #9bb8c8;border-radius:7px;font:inherit;margin-top:4px}button{background:var(--blue);color:white;border:0;border-radius:7px;padding:11px 18px;font-weight:700;font:inherit;cursor:pointer}.q{padding:18px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}.qnum{font-weight:800;color:var(--blue)}.opt{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:7px;margin:7px 0;cursor:pointer}.opt:has(input:checked){background:var(--pale);border-color:var(--blue)}.opt input{width:auto;margin:0 8px 0 0}.group{border-left:5px solid var(--blue);padding-left:10px}.易{border-color:var(--easy)}.中{border-color:var(--mid)}.難{border-color:var(--hard)}.bar{position:sticky;bottom:0;background:#163349;color:white;padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hide{display:none}.ok{border-left:4px solid #287d48;padding-left:9px}.bad{border-left:4px solid #a33f38;padding-left:9px}.result{font-size:1.25rem;font-weight:800}.note{font-size:.88rem;color:#536a78}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px 90px}h1{font-size:1.4rem}}</style>
<main class="wrap"><header><h1>腎臟系統國考分級練習</h1><div>30 題、易／中／難各 10 題；範圍為腎功能、腎衰竭、腎絲球疾病、透析與腎移植。</div></header>
<section id="setup" class="card"><h2>開始作答</h2><div class="grid"><label>學號<input id="sid" required maxlength="32"></label><label>姓名<input id="name" required></label><label>班級<input id="klass"></label></div><p class="note">難度為教學用分級，非考選部官方難度。已排除泌尿道、膀胱、尿道、導尿、尿失禁與結石主題。</p><button id="start">開始 30 題練習</button></section>
<section id="quiz" class="hide"><div class="card"><div id="questions"></div></div><div class="bar"><span id="progress"></span><button id="submit">交卷並計分</button></div></section><section id="result" class="hide card"><h2>本回結果</h2><div id="score" class="result"></div><div id="review"></div><p><button onclick="location.reload()">再做一次</button></p></section></main><script src="renal-quiz-data.js"></script><script>
const D=window.RENAL_QUIZ,$=s=>document.querySelector(s);let active=D.items;function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){let last='';$('#questions').innerHTML=active.map((q,i)=>{let head=q.level!==last?(last=q.level,`<h2 class="group ${q.level}">${q.level}｜第 ${i+1}–${i+10} 題</h2>`):'';return `${head}<article class="q"><div class="qnum">第 ${i+1} 題</div><div>${esc(q.stem)}</div>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${'ABCD'[j]}">(${ 'ABCD'[j] }) ${esc(o)}</label>`).join('')}</article>`}).join('');document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=progress);progress()}function progress(){let n=active.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;$('#progress').textContent=`已作答 ${n} / 30`}$('#start').onclick=()=>{if(!$('#sid').value.trim()||!$('#name').value.trim()){alert('請先填寫學號與姓名。');return}$('#setup').classList.add('hide');$('#quiz').classList.remove('hide');render();scrollTo(0,0)};$('#submit').onclick=()=>{let a=active.map((_,i)=>document.querySelector(`input[name=q${i}]:checked`)?.value||''),blank=a.map((x,i)=>x?'':i+1).filter(Boolean);if(blank.length&&!confirm(`尚有第 ${blank.join('、')} 題未作答，仍要交卷嗎？`))return;let n=a.filter((x,i)=>x===active[i].answer).length;$('#quiz').classList.add('hide');$('#result').classList.remove('hide');$('#score').textContent=`答對 ${n} / 30 題，得分 ${(n/30*100).toFixed(1)} / 100 分`;$('#review').innerHTML=active.map((q,i)=>`<div class="${a[i]===q.answer?'ok':'bad'}"><b>第 ${i+1} 題（${q.level}）：</b>${a[i]===q.answer?'答對':`你的答案 ${a[i]||'未作答'}；正確答案 ${q.answer}`}　<a href="${q.url}" target="_blank">官方題目來源</a></div>`).join('');scrollTo(0,0)};</script>
