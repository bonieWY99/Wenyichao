<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1673a8"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="成人護理練習">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
  <title>成人護理學九單元隨機練習</title>
  <style>
    :root{--ink:#163349;--blue:#1673a8;--pale:#eef7fb;--line:#c9dce7;--warn:#9a3c2d;--ok:#287d48}*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}.wrap{max-width:920px;margin:auto;padding:28px 18px 88px}header{border-left:6px solid var(--blue);padding-left:16px;margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}h1{font-size:1.7rem;margin:0 0 6px}h2{font-size:1.2rem;margin:30px 0 12px;color:#104e72}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 2px 9px #113a5011}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}input,select{width:100%;padding:10px;border:1px solid #9bb8c8;border-radius:7px;font:inherit}button{background:var(--blue);color:white;border:0;border-radius:7px;padding:11px 18px;font-weight:700;font:inherit;cursor:pointer}button.secondary{background:white;color:var(--blue);border:1px solid var(--blue)}button.danger{color:#9a3c2d;border-color:#9a3c2d}button:disabled{opacity:.5;cursor:not-allowed}.meta{color:#5a7180;font-size:.88rem}.q{padding:18px 0;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:0}.qnum{font-weight:800;color:var(--blue)}.opt{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:7px;margin:7px 0;cursor:pointer}.opt:has(input:checked){background:var(--pale);border-color:var(--blue)}.opt input{width:auto;margin-right:8px}.bar{position:sticky;bottom:0;background:#163349;color:white;padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hide{display:none}.result{font-size:1.25rem;font-weight:800}.ok{border-left:4px solid var(--ok);padding-left:9px}.bad{border-left:4px solid var(--warn);padding-left:9px}.notice{font-size:.85rem;color:#536a78}.review{margin-top:12px;padding:15px;border:1px solid var(--line);border-radius:9px;background:#fbfdfe}.review p{margin:8px 0}.review ul{margin:8px 0;padding-left:24px}.review .choice{padding:4px 6px;border-radius:4px}.review .right{background:#eaf7ee;color:#175b30;font-weight:700}.review .wrong{background:#fff0ee;color:#8a3022;font-weight:700}.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.history-row:last-child{border:0}.history-row strong{display:block}.history-row button{white-space:nowrap;padding:8px 12px}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px 90px}h1{font-size:1.4rem}header{display:block}header button{margin-top:12px}.history-row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="wrap">
  <header><div><h1>成人護理學九單元隨機練習</h1><div>每回 20 題，滿分 100 分。題目取自考選部護理師內外科護理學官方題庫。</div></div><button id="historyBtn" class="secondary">我的紀錄</button></header>
  <p id="iosInstall" class="card notice hide"><b>加入 iPhone 主畫面：</b>請使用 Safari 點選「分享」，再選「加入主畫面」；之後可從圖示全螢幕開啟。</p>
  <section id="setup" class="card"><h2>開始練習</h2><div class="grid"><div class="field"><label>學號</label><input id="sid" required maxlength="32"></div><div class="field"><label>姓名</label><input id="name" required></div><div class="field"><label>班級</label><input id="klass"></div></div><div class="field" style="margin-top:14px"><label>複習系統</label><select id="module"></select></div><p id="poolInfo" class="meta"></p><button id="start">抽 20 題開始作答</button></section>
  <section id="quiz" class="hide"><div class="card"><div id="quizTitle"></div><p class="notice">本回題目可重複作答；交卷後立即顯示分數與官方答案。若題幹文字或圖表有疑義，請以官方連結與原始 PDF 為準。</p><div id="questions"></div></div><div class="bar"><span id="progress">已作答 0 / 20</span><button id="submit">交卷並計分</button></div></section>
  <section id="result" class="hide card"><h2>本回結果</h2><div id="score" class="result"></div><p id="student" class="meta"></p><div id="review"></div><p><button id="again">重新抽 20 題</button> <button id="download" class="secondary">下載本回紀錄</button></p></section>
  <section id="history" class="hide card"><h2>我的紀錄</h2><p class="notice">紀錄僅保留在此 iPhone／瀏覽器；若清除 Safari 網站資料或更換裝置，紀錄將不會同步。</p><div id="historyList"></div><p><button id="backToPractice" class="secondary">回到練習</button> <button id="clearHistory" class="secondary danger">清除本機紀錄</button></p></section>
</main>
<script src="practice-data.js"></script>
<script>
const D=window.MOEX_PRACTICE,$=s=>document.querySelector(s),KEY='adult-nursing-quiz-history-v1';let active=[],currentRecord=null;
const select=$('#module');D.modules.forEach(m=>{let o=document.createElement('option');o.value=m.id;o.textContent=`${m.name}（題池 ${m.count} 題）`;select.append(o)});
function info(){let m=D.modules.find(x=>x.id==select.value);$('#poolInfo').textContent=`此系統目前有 ${m.count} 題可抽取；每回隨機取 20 題。`}select.onchange=info;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function hideAll(){['setup','quiz','result','history'].forEach(id=>$('#'+id).classList.add('hide'))}function show(id){hideAll();$('#'+id).classList.remove('hide')}
function render(){const m=D.modules.find(x=>x.id==select.value);active=shuffle(D.pools[m.id]).slice(0,20);show('quiz');$('#quizTitle').innerHTML=`<h2>${m.name} 練習</h2><div class="meta">${$('#name').value}　${$('#sid').value}　${$('#klass').value}</div>`;$('#questions').innerHTML=active.map((q,i)=>`<article class="q"><div class="qnum">第 ${i+1} 題</div><div>${q.stem}</div>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${'ABCD'[j]}">(${'ABCD'[j]}) ${o}</label>`).join('')}</article>`).join('');document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=progress);progress();window.scrollTo(0,0)}
function progress(){let n=active.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;$('#progress').textContent=`已作答 ${n} / 20`}
function history(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(record){try{let records=history();records.unshift(record);localStorage.setItem(KEY,JSON.stringify(records))}catch{alert('本機儲存空間不足，本回紀錄仍可下載。')}}
function reviewMarkup(record){return record.questions.map((q,i)=>`<article class="review ${q.selected===q.answer?'ok':'bad'}"><div class="qnum">第 ${i+1} 題　${q.selected===q.answer?'答對':'答錯'}</div><p><b>${q.stem}</b></p><ul>${q.options.map((option,j)=>{let letter='ABCD'[j],classes=['choice'];if(letter===q.answer)classes.push('right');if(letter===q.selected&&letter!==q.answer)classes.push('wrong');return `<li class="${classes.join(' ')}">（${letter}）${option}${letter===q.answer?' ← 正確答案':''}${letter===q.selected?' ← 我的答案':''}</li>`}).join('')}</ul><p class="meta">你的答案：${q.selected||'未作答'}　｜　正確答案：${q.answer}　｜　<a href="${q.url}" target="_blank" rel="noopener">官方題目來源</a></p></article>`).join('')}
function displayRecord(record){currentRecord=record;show('result');$('#score').textContent=`答對 ${record.correct} / 20 題，得分 ${record.score} / 100 分`;$('#student').textContent=`${record.name}（${record.student_id}）｜${record.module}｜${new Date(record.created_at).toLocaleString('zh-TW')}`;$('#review').innerHTML=reviewMarkup(record);window.scrollTo(0,0)}
function renderHistory(){let records=history();show('history');$('#historyList').innerHTML=records.length?records.map((record,i)=>`<div class="history-row"><div><strong>${record.module}｜${record.score} / 100 分</strong><span class="meta">${record.name}（${record.student_id}）｜${new Date(record.created_at).toLocaleString('zh-TW')}｜答對 ${record.correct}/20 題</span></div><button class="secondary" data-record="${i}">查看題目與解答</button></div>`).join(''):'<p class="meta">尚無作答紀錄。完成並交卷後，測驗會自動儲存在這裡。</p>';document.querySelectorAll('[data-record]').forEach(button=>button.onclick=()=>displayRecord(records[Number(button.dataset.record)]));window.scrollTo(0,0)}
info();$('#start').onclick=()=>{if(!$('#sid').value.trim()||!$('#name').value.trim()){alert('請先填寫學號與姓名。');return}render()};
$('#submit').onclick=()=>{let blanks=[],answers=active.map((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);if(!x)blanks.push(i+1);return x?x.value:''});if(blanks.length&&!confirm(`尚有第 ${blanks.join('、')} 題未作答，仍要交卷嗎？`))return;let correct=answers.filter((a,i)=>a===active[i].answer).length;let record={id:Date.now().toString(36),created_at:new Date().toISOString(),student_id:$('#sid').value,name:$('#name').value,class:$('#klass').value,module:D.modules.find(x=>x.id==select.value).name,correct,score:correct*5,questions:active.map((q,i)=>({id:q.id,stem:q.stem,options:q.options,selected:answers[i],answer:q.answer,url:q.url}))};save(record);displayRecord(record)};
$('#again').onclick=render;$('#historyBtn').onclick=renderHistory;$('#backToPractice').onclick=()=>show('setup');$('#clearHistory').onclick=()=>{if(confirm('確定清除這台裝置上的所有作答紀錄嗎？此動作無法復原。')){localStorage.removeItem(KEY);renderHistory()}};
$('#download').onclick=()=>{if(!currentRecord)return;let b=new Blob([JSON.stringify(currentRecord,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${currentRecord.student_id}-${currentRecord.created_at.slice(0,10)}-練習紀錄.json`;a.click();URL.revokeObjectURL(a.href)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');const ios=/iPad|iPhone|iPod/.test(navigator.userAgent),standalone=window.navigator.standalone||window.matchMedia('(display-mode:standalone)').matches;if(ios&&!standalone)$('#iosInstall').classList.remove('hide');
</script>
</body></html>
